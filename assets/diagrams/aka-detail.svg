<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img"><title>AKA AI 고객 Agent, 평가와 RAG, 서비스 연동 업무 범위</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a7b2c3" opacity=".4"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#344878"/></marker></defs><rect width="900" height="350" fill="#e7ebf0"/><rect width="900" height="350" fill="url(#grid)"/><g font-family="Arial, sans-serif" fill="#232c3f"><text x="30" y="40" font-size="22" fill="#424c61" text-anchor="start">AKA AI / 담당 업무</text><text x="30" y="72" font-size="15" fill="#424c61" text-anchor="start">AI 고객과 대화하며 응대를 연습하는 서비스입니다.</text><rect x="38" y="115" width="250" height="150" fill="#919dad"/><rect x="35" y="112" width="250" height="150" fill="#fdfdfb" stroke="#4c5567"/><rect x="38" y="115" width="244" height="23" fill="#335b78"/><text x="160.0" y="131" font-size="12" fill="#fff" text-anchor="middle">AI CUSTOMER AGENT</text><text x="160.0" y="161" font-size="13" fill="#424c61" text-anchor="middle">고객 역할 대화</text><text x="160.0" y="181" font-size="13" fill="#424c61" text-anchor="middle">프롬프트 조정</text><rect x="328" y="115" width="250" height="150" fill="#919dad"/><rect x="325" y="112" width="250" height="150" fill="#fdfdfb" stroke="#4c5567"/><rect x="328" y="115" width="244" height="23" fill="#335b78"/><text x="450.0" y="131" font-size="12" fill="#fff" text-anchor="middle">EVALUATION / RAG</text><text x="450.0" y="161" font-size="13" fill="#424c61" text-anchor="middle">대화 평가와 반복 개선</text><text x="450.0" y="181" font-size="13" fill="#424c61" text-anchor="middle">제품 지식 근거 검색</text><rect x="618" y="115" width="250" height="150" fill="#919dad"/><rect x="615" y="112" width="250" height="150" fill="#fdfdfb" stroke="#4c5567"/><rect x="618" y="115" width="244" height="23" fill="#335b78"/><text x="740.0" y="131" font-size="12" fill="#fff" text-anchor="middle">SERVICE INTEGRATION</text><text x="740.0" y="161" font-size="13" fill="#424c61" text-anchor="middle">비동기 작업 상태 전달</text><text x="740.0" y="181" font-size="13" fill="#424c61" text-anchor="middle">컨테이너 프록시 연결</text><text x="450" y="313" font-size="14" fill="#424c61" text-anchor="middle">고객 시뮬레이션 / 대화 평가 / 서비스 연동</text></g></svg>